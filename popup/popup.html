<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Learning Tracker</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0e0f12;--bg2:#161820;--bg3:#1d1f28;
      --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
      --text:#eeedf0;--muted:#7c7e8a;
      --green:#3ecf8e;--purple:#8b7cf8;--amber:#f5a623;--red:#e85d5d;
    }
    body{width:360px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;overflow:hidden}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;border-bottom:1px solid var(--border)}
    .brand{display:flex;align-items:center;gap:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
    .dot.inactive{background:var(--muted);box-shadow:none}
    .brand-name{font-weight:600;font-size:14px;letter-spacing:-.02em}
    .brand-name em{color:var(--green);font-style:normal}
    .brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
    .hdr-btns{display:flex;gap:5px}
    .hbtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}
    .hbtn:hover{background:var(--bg3);color:var(--text)}

    /* Now tracking */
    #tracking-bar{display:none;align-items:center;gap:9px;padding:9px 14px;background:rgba(62,207,142,.07);border-bottom:1px solid rgba(62,207,142,.15);font-size:12px}
    #tracking-bar.active{display:flex}
    .tracking-pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s ease-in-out infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    #tracking-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--green)}
    .stop-btn{background:none;border:1px solid rgba(62,207,142,.3);border-radius:5px;color:var(--green);font-size:11px;padding:2px 8px;cursor:pointer}
    .stop-btn:hover{background:rgba(62,207,142,.1)}

    /* Stats */
    .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:11px 14px;border-bottom:1px solid var(--border)}
    .stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 10px}
    .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
    .stat-val{font-size:19px;font-weight:600;letter-spacing:-.03em;line-height:1}
    .stat-val.g{color:var(--green)}.stat-val.p{color:var(--purple)}.stat-val.a{color:var(--amber)}

    /* Insights */
    .section{padding:10px 14px;border-bottom:1px solid var(--border)}
    .section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
    .section-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
    .section-btn{background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0}
    .section-btn:hover{color:var(--text)}
    .insight{display:flex;gap:8px;padding:7px 9px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;font-size:12px;line-height:1.4}
    .insight:last-child{margin-bottom:0}
    .insight-ico{flex-shrink:0;font-size:13px}
    #insights-placeholder{color:var(--muted);font-size:12px;padding:4px 0}

    /* Sessions */
    .sessions-area{max-height:160px;overflow-y:auto;padding:10px 14px}
    .sessions-area::-webkit-scrollbar{width:3px}
    .sessions-area::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
    .session-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
    .session-row:last-child{border-bottom:none}
    .sdot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0}
    .sdot.synced{background:var(--green)}.sdot.pending{background:var(--amber)}.sdot.enriching{background:var(--purple);animation:pulse 1.5s infinite}
    .sinfo{flex:1;min-width:0}
    .sconcept{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .smeta{display:flex;gap:6px;margin-top:2px;font-size:11px;color:var(--muted)}
    .sdomain{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
    .empty-sessions{text-align:center;padding:16px;color:var(--muted);font-size:12px}
    .empty-ico{font-size:24px;margin-bottom:6px}

    /* Footer */
    .footer{padding:11px 14px;border-top:1px solid var(--border);display:flex;gap:7px}
    .sync-btn{flex:1;height:36px;border-radius:8px;border:none;background:var(--green);color:#0a1f14;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .15s}
    .sync-btn:hover{background:#4fe09d}
    .sync-btn:disabled{opacity:.4;cursor:not-allowed}
    .sync-btn.busy{background:var(--bg3);color:var(--green);border:1px solid var(--green)}
    .badge{background:#0a1f14;color:var(--green);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:700}

    /* No key banner */
    .banner{margin:9px 14px 0;padding:9px 11px;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.2);border-radius:7px;font-size:12px;color:var(--amber);line-height:1.5}
    .banner a{color:var(--amber);cursor:pointer;text-decoration:underline}
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="brand">
    <div class="dot" id="status-dot"></div>
    <div>
      <div class="brand-name">Learning <em>Tracker</em></div>
      <div class="brand-sub">Powered by Groq</div>
    </div>
  </div>
  <div class="hdr-btns">
    <button class="hbtn" id="btn-refresh" title="Refresh">↻</button>
    <button class="hbtn" id="btn-settings" title="Settings">⚙</button>
  </div>
</div>

<!-- Now tracking bar -->
<div id="tracking-bar">
  <div class="tracking-pulse"></div>
  <div id="tracking-title">Tracking…</div>
  <button class="stop-btn" id="btn-stop">Stop</button>
</div>

<!-- No-key banner -->
<div class="banner" id="no-key-banner" style="display:none">
  ⚠ Add your <a id="link-settings">Groq API key</a> to enable AI enrichment &amp; insights.
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-label">HRS TODAY</div><div class="stat-val g" id="s-hrs">0.0</div></div>
  <div class="stat"><div class="stat-label">Sessions today</div><div class="stat-val p" id="s-sess">0</div></div>
  <div class="stat"><div class="stat-label">DAY STREAK</div><div class="stat-val a" id="s-streak">0</div></div>
</div>

<!-- AI Insights -->
<div class="section" id="insights-section">
  <div class="section-hdr">
    <span class="section-title">✦ Groq Analysis</span>
    <button class="section-btn" id="btn-insights">Refresh</button>
  </div>
  <div id="insights-list">
    <div id="insights-placeholder">Insights generate after a few sessions are captured.</div>
  </div>
</div>

<!-- Recent sessions -->
<div class="section" style="border-bottom:none;padding-bottom:4px">
  <div class="section-hdr">
    <span class="section-title">Recent Sessions</span>
  </div>
</div>
<div class="sessions-area" id="sessions-list">
  <div class="empty-sessions">
    <div class="empty-ico">▶</div>
    Play any video to start tracking your learning journey.
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <button class="sync-btn" id="btn-sync" disabled>
    <span>⟳ Sync Learning</span>
    <span class="badge" id="sync-badge" style="display:none">0</span>
  </button>
</div>

<script src="popup.js"></script>
</body>
</html>
